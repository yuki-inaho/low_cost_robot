part: follower_elbow_to_wrist_extension
intent: >-
  the "connector" extension link used in the longer-arm build (adds joint6 reach). A
  long beam (Y -73.046..17.054 = 90.1) that bridges two servo/horn interfaces along X.
  Frame - X[-17.5,17.5] Y[-73.046,17.054] Z[0,23]. Upstream end (Y~2..15) - a 4x phi1.8
  tap diamond + 2x phi8 idler bores (axis X); downstream end (Y~-69) - 2x M2 clearance
  (axis X). The XL330->XL430 swap grows the end interfaces to the XL430 horn/idler; the
  LINK LENGTH (90.1) is preserved. MEASURED via cadre.cli inspect.
swap_applicable: true
features:
  - name: upstream_horn_mount   # 4x phi1.8 tap diamond (axis X) at the upstream end
    type: servo_mount
    servo: XL330-M288-T          # swap to XL430-W250-T
    preserves: [output_axis, screw_pattern]
    constraints:
      screw: M2-tap
      hole_function: tap         # dia 1.80 -> M2-tap (self-tap into horn)
      hole_diameter_mm: 1.8
      through: false             # 8 faces / 4 axes -> 2 faces per line = blind tap (X)
      blind_depth_mm: 6.0
      through_evidence: "8 faces / 4 axes -> 2 faces per line = blind tap from the +X face"
      horn_axis_dir: [1.0, 0.0, 0.0]
      diamond_centers_yz_mm: [[8.6, 2.5], [14.6, 8.5], [8.6, 14.5], [2.6, 8.5]]
      face_x_mm: 17.5
  - name: idler_bores           # 2x phi8 idler/horn shaft bores (axis X)
    type: bore
    preserves: [output_axis]
    constraints:
      diameter_mm: 8.0
      axis_dir: [1.0, 0.0, 0.0]
      centers_yz_mm: [[11.3, 12.4], [13.1, 9.1]]
      through: false             # 4 faces / 2 axes -> 2 faces per line = blind idler seats
      blind_depth_mm: 5.0
      through_evidence: "8.0 dia 4 faces / 2 axes -> blind idler/horn seats from +X"
      seat_role: idler_seat
  - name: downstream_mount      # 2x M2 clearance through (axis X) at the far end
    type: servo_mount
    servo: XL330-M288-T
    preserves: [screw_pattern]
    constraints:
      screw: M2
      hole_function: clearance   # dia 2.20 -> M2 clearance (through-bolt)
      hole_diameter_mm: 2.2
      through: true              # 4 faces / 2 axes -> 2 coaxial faces per line = through (X)
      through_evidence: "4 faces / 2 axes -> 2 coaxial faces per line = through along X"
      mount_axis_dir: [1.0, 0.0, 0.0]
      mount_centers_mm: [[0.0, -69.3, 3.2], [0.0, -69.3, 19.2]]
  - name: upstream_round_flange
    type: structural_support
    preserves: [hole_centers, hole_diameters, output_axis, link_length]
    constraints:
      profile: circle_yz          # circular flange (was oval_yz) for uniform edge distance
      center_yz_mm: [10.5, 9.5]
      radius_mm: 12.0             # outer radius; max hole-EDGE extent 8.863mm (tap @YZ(2.6,8.5),
                                  # centre-dist 7.963 + r0.9) -> true min wall 3.137mm >= 2.5
      flange_thickness_mm: 3.0    # OUTWARD collar depth from the upstream face (+X only)
      outward_only: true          # do NOT extrude both ways; the inward half hit the XL430
                                  # servo body + horn (DC15_A01) in assembly context. An
                                  # outward-only collar clears all neighbours (assembly
                                  # boolean intersection = 0mm^3) while keeping >=2.5mm wall.
      min_wall_mm: 2.5
      cut_source_face_x_mm: 17.5   # blind seats are re-referenced to the collar outer face
                                  # (face + thickness) so they stay open through the collar
                                  # with the SAME YZ centers / diameter / axis / termination.
      bbox_growth: "intentional upstream collar growth in +X; link_length_y_mm preserved"
  - name: link_beam
    type: structural_beam
    preserves: [joint_distance, link_length]
    constraints:
      min_wall_mm: 2.5
      link_length_y_mm: 90.1     # Y extent (preserved on swap)
      upstream_face_x_mm: 17.5
measured_families:
  - {diameter_mm: 1.8, screw: null, axes: 4, faces: 8, dir: [1,0,0]}
  - {diameter_mm: 8.0, screw: null, axes: 2, faces: 4, dir: [1,0,0]}
  - {diameter_mm: 2.2, screw: M2,   axes: 2, faces: 4, dir: [1,0,0]}
tests:
  - hole_pattern_match
  - envelope_clearance
  - min_wall_thickness
